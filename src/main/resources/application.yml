server:
  port: 8080

spring:
  application:
    name: rider-safety-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riderdb}
    username: ${DB_USER:rider}
    password: ${DB_PASSWORD:rider123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    session:
      timeout: 8h

logging:
  level:
    root: info
